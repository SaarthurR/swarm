<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-label="The swarm run: phases 0 through 6, with phase 5 looping back to diagnosis until verification and a fresh sweep both come back empty">
  <defs>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF9473"/>
    </marker>
  </defs>

  <rect width="1200" height="336" rx="40" fill="#F6F3F1"/>
  <rect x="0.5" y="0.5" width="1199" height="335" rx="40" fill="none" stroke="#CECAC8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="52" fill="#797776" font-size="11" letter-spacing="1.2">THE RUN · PHASES 0 → 6</text>

    <line x1="106" y1="182" x2="1094" y2="182" stroke="#CECAC8" stroke-width="1.6"/>

    <!-- phase 0 -->
    <g text-anchor="middle">
      <text x="106" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Ingest</text>
      <text x="106" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">docs · MCPs · memory</text>
      <circle cx="106" cy="182" r="21" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
      <text x="106" y="187" fill="#242424" font-size="13">0</text>
    </g>
    <!-- phase 1 -->
    <g text-anchor="middle">
      <text x="247" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Recon</text>
      <text x="247" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">map + dependency DAG</text>
      <circle cx="247" cy="182" r="21" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
      <text x="247" y="187" fill="#242424" font-size="13">1</text>
    </g>
    <!-- phase 2 -->
    <g text-anchor="middle">
      <text x="388" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Diagnose</text>
      <text x="388" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">cause + challenger</text>
      <circle cx="388" cy="182" r="21" fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.8"/>
      <text x="388" y="187" fill="#242424" font-size="13">2</text>
    </g>
    <!-- phase 2.5 -->
    <g text-anchor="middle">
      <text x="529" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Deliberate</text>
      <text x="529" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">critique before code</text>
      <circle cx="529" cy="182" r="21" fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.8"/>
      <text x="529" y="187" fill="#242424" font-size="12">2.5</text>
    </g>
    <!-- phase 3 -->
    <g text-anchor="middle">
      <text x="670" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Fix</text>
      <text x="670" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">isolated worktrees</text>
      <circle cx="670" cy="182" r="21" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
      <text x="670" y="187" fill="#242424" font-size="13">3</text>
    </g>
    <!-- phase 4 -->
    <g text-anchor="middle">
      <text x="811" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Review</text>
      <text x="811" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">against the diff</text>
      <circle cx="811" cy="182" r="21" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
      <text x="811" y="187" fill="#242424" font-size="13">4</text>
    </g>
    <!-- phase 5 — the gate. The one saturated fill in the diagram. -->
    <g text-anchor="middle">
      <text x="952" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Verify + sweep</text>
      <text x="952" y="152" fill="#4E4D4D" font-size="11" letter-spacing="-0.22">real command output</text>
      <circle cx="952" cy="182" r="28" fill="none" stroke="#A0B5EB"/>
      <circle cx="952" cy="182" r="21" fill="#2B59D1"/>
      <text x="952" y="187" fill="#FFFFFF" font-size="13">5</text>
    </g>
    <!-- phase 6 -->
    <g text-anchor="middle">
      <text x="1093" y="130" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">Ship</text>
      <text x="1093" y="152" fill="#797776" font-size="11" letter-spacing="-0.22">cross-check + PR</text>
      <circle cx="1093" cy="182" r="21" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
      <text x="1093" y="187" fill="#242424" font-size="13">6</text>
    </g>

    <!-- the loop back -->
    <path d="M952 212 C 952 266, 388 266, 388 206" fill="none" stroke="#FF9473"
          stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#loop)"/>
    <g transform="translate(504 240)">
      <rect width="332" height="34" rx="17" fill="#F6F3F1" stroke="#CECAC8"/>
      <text x="166" y="22" fill="#242424" font-size="11.5" letter-spacing="-0.23" text-anchor="middle">THE SWEEP FOUND SOMETHING → BACK TO DIAGNOSIS</text>
    </g>

    <text x="600" y="304" fill="#797776" font-size="12" letter-spacing="-0.24" text-anchor="middle">Exit only when verification is all-green and a fresh sweep comes back empty — in the same round.</text>
  </g>
</svg>
