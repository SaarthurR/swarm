<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-label="Parallel fixers work in isolated git worktrees; independent branches each open their own PR to main, while a dependent branch opens a stacked PR targeting the branch below it">
  <rect width="1200" height="336" rx="40" fill="#F6F3F1"/>
  <rect x="0.5" y="0.5" width="1199" height="335" rx="40" fill="none" stroke="#CECAC8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="52" fill="#797776" font-size="11" letter-spacing="1.2">ISOLATED WHILE WORKING · STACKED WHEN SHIPPING</text>

    <!-- main -->
    <line x1="72" y1="258" x2="1144" y2="258" stroke="#CECAC8" stroke-width="1.6"/>
    <text x="72" y="280" fill="#797776" font-size="11.5" letter-spacing="-0.23">MAIN</text>

    <!-- branch B — independent, and deliberately the quiet one -->
    <path d="M140 258 C 176 258, 176 96, 212 96 L 848 96" fill="none" stroke="#CECAC8" stroke-width="1.6"/>
    <text x="212" y="78" fill="#797776" font-size="11.5" letter-spacing="-0.23">WORKTREE B · BRANCHB</text>
    <circle cx="360" cy="96" r="5" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
    <circle cx="500" cy="96" r="5" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
    <circle cx="640" cy="96" r="5" fill="#F6F3F1" stroke="#CECAC8" stroke-width="1.6"/>
    <rect x="860" y="74" width="284" height="44" rx="22" fill="#F6F3F1" stroke="#CECAC8"/>
    <text x="884" y="102" fill="#242424" font-size="12" letter-spacing="-0.24">PR #2 · BRANCHB → MAIN</text>

    <!-- branch C — stacked on A, so it carries the coloured PR surface -->
    <path d="M540 192 C 576 192, 576 158, 612 158 L 848 158" fill="none" stroke="#A0B5EB" stroke-width="1.6"/>
    <text x="612" y="140" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">WORKTREE C · BRANCHC — BUILDS ON A</text>
    <circle cx="712" cy="158" r="5" fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.6"/>
    <circle cx="792" cy="158" r="5" fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.6"/>
    <rect x="860" y="130" width="284" height="56" rx="28" fill="#CFDAF5" stroke="#A0B5EB"/>
    <text x="884" y="154" fill="#242424" font-size="12" letter-spacing="-0.24">PR #3 · BRANCHC → BRANCHA</text>
    <text x="884" y="172" fill="#4E4D4D" font-size="11" letter-spacing="-0.22">STACKED — LANDS AFTER #1</text>

    <!-- branch A — independent -->
    <path d="M232 258 C 268 258, 268 192, 304 192 L 848 192" fill="none" stroke="#A0B5EB" stroke-width="1.6"/>
    <text x="304" y="226" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">WORKTREE A · BRANCHA</text>
    <circle cx="400" cy="192" r="5" fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.6"/>
    <circle cx="540" cy="192" r="6" fill="#A0B5EB" stroke="#A0B5EB" stroke-width="1.6"/>
    <circle cx="700" cy="192" r="5" fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.6"/>
    <rect x="860" y="198" width="284" height="44" rx="22" fill="#F6F3F1" stroke="#CECAC8"/>
    <text x="884" y="226" fill="#242424" font-size="12" letter-spacing="-0.24">PR #1 · BRANCHA → MAIN</text>

    <text x="72" y="302" fill="#797776" font-size="12" letter-spacing="-0.24">Concurrent fixers never share a working tree — “different files, same index” still collides.</text>
    <text x="72" y="320" fill="#797776" font-size="12" letter-spacing="-0.24">Ordered chains ship as a stack, so every PR’s diff shows only its own change.</text>
  </g>
</svg>
