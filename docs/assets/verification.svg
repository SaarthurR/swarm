<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-label="Every claim is handed to an independent agent with fresh context to disprove: confirmed claims graduate to action, refuted ones go back to diagnosis, disagreements are adjudicated by a third agent">
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#242424"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5FBE8E"/>
    </marker>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF9473"/>
    </marker>
    <marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#CECAC8"/>
    </marker>
  </defs>

  <rect width="1200" height="356" rx="40" fill="#F6F3F1"/>
  <rect x="0.5" y="0.5" width="1199" height="355" rx="40" fill="none" stroke="#CECAC8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="52" fill="#797776" font-size="11" letter-spacing="1.2">NO CLAIM SURVIVES ON ONE AGENT&#39;S WORD</text>

    <!-- the claim -->
    <rect x="56" y="102" width="292" height="132" rx="28" fill="#F6F3F1" stroke="#CECAC8"/>
    <text x="82" y="144" fill="#242424" font-size="22" font-family="Georgia, 'Times New Roman', Times, serif">a claim</text>
    <text x="82" y="174" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">“this is the root cause”</text>
    <text x="82" y="194" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">“this fix is the right one”</text>
    <text x="82" y="214" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">“nothing else calls this”</text>

    <line x1="360" y1="168" x2="428" y2="168" stroke="#242424" stroke-width="1.4" marker-end="url(#ma)"/>

    <!-- the challenger: the one coloured surface in the diagram -->
    <rect x="440" y="92" width="252" height="152" rx="32" fill="#CFDAF5" stroke="#A0B5EB"/>
    <text x="566" y="140" fill="#242424" font-size="22" font-family="Georgia, 'Times New Roman', Times, serif" text-anchor="middle">independent agent</text>
    <text x="566" y="164" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23" text-anchor="middle">FRESH CONTEXT · NEVER THE AUTHOR</text>
    <rect x="478" y="182" width="176" height="34" rx="17" fill="#F6F3F1" stroke="#A0B5EB"/>
    <text x="566" y="204" fill="#242424" font-size="11.5" letter-spacing="-0.23" text-anchor="middle">TRY TO DISPROVE THIS</text>

    <!-- outcomes -->
    <path d="M704 142 C 750 142, 750 124, 794 124" fill="none" stroke="#5FBE8E" stroke-width="1.4" marker-end="url(#mg)"/>
    <rect x="806" y="94" width="338" height="66" rx="33" fill="#EAFBF2" stroke="#A7FCCD"/>
    <text x="838" y="124" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">confirmed</text>
    <text x="838" y="144" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">only now does it graduate to action</text>

    <path d="M704 196 C 750 196, 750 216, 794 216" fill="none" stroke="#FF9473" stroke-width="1.4" marker-end="url(#mr)"/>
    <rect x="806" y="186" width="338" height="66" rx="33" fill="#FDEEE8" stroke="#FF9473"/>
    <text x="838" y="216" fill="#242424" font-size="19" font-family="Georgia, 'Times New Roman', Times, serif">refuted</text>
    <text x="838" y="236" fill="#4E4D4D" font-size="11.5" letter-spacing="-0.23">back to diagnosis with what it learned</text>

    <!-- adjudication loop -->
    <path d="M520 252 L 520 276" fill="none" stroke="#CECAC8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mw)"/>
    <rect x="440" y="284" width="252" height="44" rx="22" fill="#F6F3F1" stroke="#CECAC8"/>
    <text x="566" y="311" fill="#242424" font-size="11.5" letter-spacing="-0.23" text-anchor="middle">A THIRD AGENT ADJUDICATES</text>
    <path d="M612 284 L 612 252" fill="none" stroke="#CECAC8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mw)"/>
    <text x="424" y="276" fill="#797776" font-size="11" letter-spacing="-0.22" text-anchor="end">THEY DISAGREE</text>

    <text x="806" y="296" fill="#797776" font-size="12" letter-spacing="-0.24">The same gate runs on assumptions: “that API</text>
    <text x="806" y="316" fill="#797776" font-size="12" letter-spacing="-0.24">exists”, “should work”, “nothing else needs it”.</text>
  </g>
</svg>
