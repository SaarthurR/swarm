<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="swarm — autonomous multi-agent orchestration for serious codebase work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C11"/>
      <stop offset="55%" stop-color="#0D1017"/>
      <stop offset="100%" stop-color="#12161F"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F6FB"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <circle cx="905" cy="180" r="230" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- fan-out graphic -->
  <g transform="translate(830 180)">
    <circle r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    <circle r="170" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>

    <g stroke="url(#edge)" stroke-width="1.4" fill="none">
      <path d="M0 0 C 90 -140, 130 -150, 164 -145"/>
      <path d="M0 0 C 90 -100, 140 -110, 176 -104"/>
      <path d="M0 0 C 95 -55, 145 -62, 182 -58"/>
      <path d="M0 0 C 100 -14, 150 -18, 188 -16"/>
      <path d="M0 0 C 100 20, 150 26, 188 24"/>
      <path d="M0 0 C 95 62, 145 70, 182 66"/>
      <path d="M0 0 C 90 108, 140 118, 176 112"/>
      <path d="M0 0 C 80 145, 125 156, 158 152"/>
    </g>

    <g stroke="#0A0C11" stroke-width="3">
      <circle cx="164" cy="-145" r="9" fill="#22D3EE"/>
      <circle cx="176" cy="-104" r="9" fill="#22D3EE"/>
      <circle cx="182" cy="-58" r="9" fill="#A78BFA"/>
      <circle cx="188" cy="-16" r="9" fill="#A78BFA"/>
      <circle cx="188" cy="24" r="9" fill="#FBBF24"/>
      <circle cx="182" cy="66" r="9" fill="#FBBF24"/>
      <circle cx="176" cy="112" r="9" fill="#34D399"/>
      <circle cx="158" cy="152" r="9" fill="#34D399"/>
    </g>

    <circle r="34" fill="#A78BFA" opacity="0.28" filter="url(#soft)"/>
    <circle r="26" fill="#0F1219" stroke="#A78BFA" stroke-width="2"/>
    <circle r="7" fill="#E9E4FF"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="url(#title)" font-size="92" font-weight="700" letter-spacing="-4">swarm</text>
    <text x="76" y="196" fill="#9AA4B8" font-size="21" font-weight="500" letter-spacing="0.2">Autonomous multi-agent orchestration for serious codebase work.</text>
    <text x="76" y="226" fill="#5C6679" font-size="17" font-weight="400">One goal in. A verified, production-ready result out.</text>

    <g font-size="13" font-weight="600" letter-spacing="0.6">
      <g transform="translate(72 262)">
        <rect width="168" height="30" rx="15" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.35"/>
        <text x="84" y="20" fill="#C4B5FD" text-anchor="middle">CROSS-VERIFIED</text>
      </g>
      <g transform="translate(252 262)">
        <rect width="196" height="30" rx="15" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.32"/>
        <text x="98" y="20" fill="#7DD3FC" text-anchor="middle">WORKTREE-ISOLATED</text>
      </g>
      <g transform="translate(460 262)">
        <rect width="184" height="30" rx="15" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.32"/>
        <text x="92" y="20" fill="#6EE7B7" text-anchor="middle">LEDGER-BACKED</text>
      </g>
    </g>
  </g>
</svg>
