<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="swarm — autonomous multi-agent orchestration for serious codebase work">
  <defs>
    <radialGradient id="w1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9473" stop-opacity="0.30"/><stop offset="100%" stop-color="#FF9473" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A0B5EB" stop-opacity="0.40"/><stop offset="100%" stop-color="#A0B5EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7FCCD" stop-opacity="0.34"/><stop offset="100%" stop-color="#A7FCCD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECDA98" stop-opacity="0.34"/><stop offset="100%" stop-color="#ECDA98" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7FCCD" stop-opacity="0.72"/><stop offset="100%" stop-color="#A7FCCD" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="40"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="40" fill="#F6F3F1"/>
  <g clip-path="url(#card)">
    <ellipse cx="90" cy="26" rx="360" ry="230" fill="url(#w1)"/>
    <ellipse cx="560" cy="10" rx="300" ry="180" fill="url(#w4)"/>
    <ellipse cx="1060" cy="300" rx="420" ry="280" fill="url(#w2)"/>
    <ellipse cx="380" cy="360" rx="330" ry="190" fill="url(#w3)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="40" fill="none" stroke="#CECAC8"/>

  <!-- the fan-out: one hub normalising into many agents -->
  <g transform="translate(880 180)">
    <g stroke="#A0B5EB" stroke-width="1.4" fill="none">
      <path d="M0 0 C 90 -140, 130 -150, 164 -145"/>
      <path d="M0 0 C 90 -100, 140 -110, 176 -104"/>
      <path d="M0 0 C 95 -55, 145 -62, 182 -58"/>
      <path d="M0 0 C 100 -14, 150 -18, 188 -16"/>
      <path d="M0 0 C 100 20, 150 26, 188 24"/>
      <path d="M0 0 C 95 62, 145 70, 182 66"/>
      <path d="M0 0 C 90 108, 140 118, 176 112"/>
      <path d="M0 0 C 80 145, 125 156, 158 152"/>
    </g>

    <g fill="#F6F3F1" stroke="#A0B5EB" stroke-width="1.6">
      <circle cx="164" cy="-145" r="8"/>
      <circle cx="176" cy="-104" r="8"/>
      <circle cx="182" cy="-58" r="8"/>
      <circle cx="188" cy="-16" r="8"/>
      <circle cx="188" cy="24" r="8"/>
      <circle cx="182" cy="66" r="8"/>
      <circle cx="176" cy="112" r="8"/>
      <circle cx="158" cy="152" r="8"/>
    </g>

    <circle r="72" fill="url(#hub)"/>
    <circle r="26" fill="#F6F3F1" stroke="#242424" stroke-width="1.6"/>
    <circle r="6" fill="#242424"/>
  </g>

  <!-- the serif announces, the mono instructs -->
  <text x="64" y="156" fill="#242424" font-size="92" letter-spacing="-1.84"
        font-family="Georgia, 'Times New Roman', Times, serif">swarm</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="68" y="200" fill="#4E4D4D" font-size="17" letter-spacing="-0.34">Autonomous multi-agent orchestration for serious codebase work.</text>
    <text x="68" y="228" fill="#797776" font-size="14" letter-spacing="-0.28">One goal in. A verified, production-ready result out.</text>

    <g font-size="11" letter-spacing="-0.37">
      <g transform="translate(66 258)">
        <rect width="134" height="34" rx="17" fill="#F6F3F1" stroke="#CECAC8"/>
        <text x="67" y="22" fill="#242424" text-anchor="middle">CROSS-VERIFIED</text>
      </g>
      <g transform="translate(210 258)">
        <rect width="154" height="34" rx="17" fill="#F6F3F1" stroke="#CECAC8"/>
        <text x="77" y="22" fill="#242424" text-anchor="middle">WORKTREE-ISOLATED</text>
      </g>
      <g transform="translate(374 258)">
        <rect width="128" height="34" rx="17" fill="#F6F3F1" stroke="#CECAC8"/>
        <text x="64" y="22" fill="#242424" text-anchor="middle">LEDGER-BACKED</text>
      </g>
    </g>
  </g>
</svg>
